<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vertical Shooter S-Rank v5.1</title>
<style>
body{margin:0;padding:16px;width:330px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#06101c,#0c1730);color:#e9f2ff}
h1{margin:0 0 8px;font-size:19px;letter-spacing:.04em}
p{margin:0 0 10px;font-size:12px;line-height:1.7;color:#c4d5ea}
.panel{margin-top:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(103,232,249,.18)}
button{width:100%;padding:14px;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#6366f1);color:white;font-size:15px;font-weight:800}
.small{font-size:11px;line-height:1.7;color:#d1e0f2}
</style></head>
<body>
<h1>Vertical Shooter S-Rank v5.1</h1>
<p>ステージ個性、敵ロール、攻撃種類、スコア拡張、演出、UIをまとめて実装した完成版です。</p>
<button id="startBtn">ゲーム開始</button>
<div class="panel small">
移動: 矢印 / WASD<br>
ショット: Z / Space / Enter<br>
低速: Shift<br>
武器切替: C<br>
ボム: X<br>
オーバードライブ: V<br>
ポーズ: P / BGM: M / DEBUG: D / 隊形: F
</div>
<script src="popup.js"></script>
</body></html>
